name: Verify published evidence

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 1b/tests/verify_evidence.py
      - run: python -m unittest discover -s 1b/tests -p 'test_*.py'
      - run: bash -n 1b/tests/run_codex.sh
